name: CI - Build Checks  # ตั้งชื่อ workflow นี้ว่า "CI - Build Checks"

# กำหนดเงื่อนไขการทำงาน
on:
  push:
    branches: [main]  # ทำงานเมื่อมี push ไปที่ branch main
  pull_request:
    branches: [main]  # ทำงานเมื่อมี pull request ไปที่ branch main

jobs:
  # Job ที่ 1: ตรวจสอบ Backend
  backend:
    name: Backend build check  # ชื่อ job
    runs-on: ubuntu-latest  # ใช้ Ubuntu เวอร์ชันล่าสุดเป็นระบบปฏิบัติการ
    defaults:
      run:
        working-directory: backend  # กำหนดให้ทุกคำสั่ง run ทำงานในโฟลเดอร์ backend
    steps:
      # ขั้นตอนที่ 1: ดึง code จาก repository
      - uses: actions/checkout@v4
      
      # ขั้นตอนที่ 2: ติดตั้ง Node.js เวอร์ชัน 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20  # ใช้ Node.js 20
          cache: npm  # ใช้ cache เพื่อเพิ่มความเร็ว
          cache-dependency-path: backend/package-lock.json  # ระบุไฟล์ lock สำหรับ cache
      
      # ขั้นตอนที่ 3: ติดตั้ง dependencies
      - name: Install dependencies
        run: npm ci  # npm ci ใช้สำหรับ CI/CD (clean install)
      
      # ขั้นตอนที่ 4: สร้าง Prisma Client
      - name: Prisma generate (validate schema)
        run: npx prisma generate  # สร้าง Prisma Client จาก schema
      
      # ขั้นตอนที่ 5: ตรวจสอบ syntax ของไฟล์ JavaScript
      - name: Syntax check
        run: |
          # ตรวจสอบไฟล์ JavaScript ทีละไฟล์
          for f in src/index.js src/cloudinary.js src/upload.js src/prismaClient.js \
                   src/middleware/auth.js src/routes/auth.js src/routes/images.js \
                   src/routes/skills.js src/routes/languages.js; do
            node --check "$f"  # node --check ใช้ตรวจสอบ syntax
          done

  # Job ที่ 2: ตรวจสอบ Frontend
  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend  # ทำงานในโฟลเดอร์ frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build  # สร้าง production build
        env:
          # ใช้ environment variable สำหรับ build
          VITE_BACKEND_ORIGIN: ${{ secrets.VITE_BACKEND_ORIGIN }}