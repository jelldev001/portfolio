name: CI - Build Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate (validate schema)
        run: npx prisma generate
      - name: Syntax check
        run: |
          for f in src/index.js src/cloudinary.js src/upload.js src/prismaClient.js \
                   src/middleware/auth.js src/routes/auth.js src/routes/images.js \
                   src/routes/skills.js src/routes/languages.js; do
            node --check "$f"
          done

  frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
        env:
          VITE_BACKEND_ORIGIN: ${{ secrets.VITE_BACKEND_ORIGIN }}